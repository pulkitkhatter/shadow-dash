'use strict';
/* =====================  CONFIG  ===================== */

const START_SPEED = 380, MAX_SPEED = 950;

/* =====================  CANVAS  ===================== */
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
function fit() {
  const s = Math.min(innerWidth / W, innerHeight / H);
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  cv.style.width = Math.floor(W * s) + 'px';
  cv.style.height = Math.floor(H * s) + 'px';
  cv.width = Math.floor(W * s * dpr);
  cv.height = Math.floor(H * s * dpr);
  fit.k = s * dpr;
}
addEventListener('resize', fit); fit();

/* =====================  STORAGE  ===================== */
function load(k, d) { try { const v = localStorage.getItem(GAME_ID + k); return v === null ? d : v; } catch (e) { return d; } }
function save(k, v) { try { localStorage.setItem(GAME_ID + k, v); } catch (e) {} }

/* =====================  AUDIO  ===================== */
let AC = null, muted = load('_mute', '0') === '1';
function audio() {
  if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
  if (AC && AC.state === 'suspended') AC.resume();
}
let adMute = false;                 // game sounds are silenced while an ad plays (portals require this)
function tone(f1, f2, dur, type = 'square', vol = 0.1) {
  if (muted || adMute || !AC) return;
  const t = AC.currentTime, o = AC.createOscillator(), g = AC.createGain();
  o.type = type;
  o.frequency.setValueAtTime(f1, t);
  o.frequency.exponentialRampToValueAtTime(Math.max(f2, 1), t + dur);
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g); g.connect(AC.destination);
  o.start(t); o.stop(t + dur);
}
const sfx = {
  jump:  () => tone(300, 700, 0.15),
  djump: () => tone(450, 950, 0.15),
  slide: () => tone(500, 150, 0.2, 'sawtooth', 0.05),
  coin:  () => tone(900, 1500, 0.09, 'triangle', 0.1),
  hit:   () => { tone(220, 40, 0.6, 'sawtooth', 0.2); tone(120, 30, 0.5, 'square', 0.12); },
  best:  () => { tone(600, 900, 0.15, 'triangle', 0.1); setTimeout(() => tone(900, 1400, 0.25, 'triangle', 0.1), 150); }
};
const BASS = [110, 110, 165, 110, 131, 131, 196, 131];
let musicT = 0, musicI = 0;

/* =====================  LANGUAGES  ===================== */
const STR = {

  hi: { name:'हिं', share:'शेयर करें', copied:'लिंक कॉपी हुआ!', shareText:'मैंने Shadow Dash में {n} स्कोर किया! क्या तुम हरा सकते हो?', world:'विश्व के टॉप 3', localBoard:'आपके टॉप 3', namePrompt:'विश्व रैंकिंग के लिए अपना नाम लिखें (अधिकतम 12 अक्षर):', tag:'रात से तेज़ दौड़ो। बचो, फिसलो, जीते रहो।', start:'शुरू करने के लिए टैप करें / Space दबाएँ', jump:'कूदें (x2):  Space / ↑ / W / दाएँ टैप', slide:'फिसलें:  ↓ / S / बाएँ टैप      रोकें: P', equipped:'चुना हुआ', equip:'चुनने के लिए टैप करें', unlock:'अनलॉक', coins:'सिक्के', best:'सर्वश्रेष्ठ', paused:'रुका हुआ', resume:'जारी रखने के लिए P दबाएँ या टैप करें', over:'गेम ओवर', score:'स्कोर', newbest:'★ नया रिकॉर्ड! ★', gained:'सिक्के', wallet:'कुल', loading:'विज्ञापन लोड हो रहा है…', revive:'▶  दोबारा खेलें (विज्ञापन देखें)', retry:'फिर खेलने के लिए टैप करें', shield:'शील्ड', magnet:'चुंबक', shieldT:'शील्ड!', magnetT:'चुंबक!', broke:'शील्ड टूटी', revived:'वापसी!', need:'{n} और सिक्के चाहिए', unlocked:'{s} अनलॉक!' },
  es: { name:'ES', share:'COMPARTIR', copied:'¡ENLACE COPIADO!', shareText:'¡Hice {n} puntos en Shadow Dash! ¿Puedes superarme?', world:'TOP 3 MUNDIAL', localBoard:'TUS TOP 3', namePrompt:'Escribe tu nombre para el ranking mundial (máx. 12):', tag:'Corre más que la noche. Esquiva, desliza, sobrevive.', start:'TOCA / PULSA ESPACIO PARA EMPEZAR', jump:'SALTAR (x2):  Espacio / ↑ / W / toca a la derecha', slide:'DESLIZAR:  ↓ / S / toca a la izquierda      PAUSA: P', equipped:'EQUIPADO', equip:'TOCA PARA EQUIPAR', unlock:'DESBLOQUEAR', coins:'MONEDAS', best:'MEJOR', paused:'PAUSA', resume:'Pulsa P o toca para continuar', over:'FIN DEL JUEGO', score:'PUNTOS', newbest:'★ ¡NUEVO RÉCORD! ★', gained:'Monedas', wallet:'Total', loading:'CARGANDO ANUNCIO…', revive:'▶  REVIVIR  (VER ANUNCIO)', retry:'TOCA / ESPACIO PARA REINTENTAR', shield:'ESCUDO', magnet:'IMÁN', shieldT:'¡ESCUDO!', magnetT:'¡IMÁN!', broke:'ESCUDO ROTO', revived:'¡REVIVIDO!', need:'FALTAN {n} MONEDAS', unlocked:'¡{s} DESBLOQUEADO!' },
  pt: { name:'PT', share:'COMPARTILHAR', copied:'LINK COPIADO!', shareText:'Fiz {n} pontos no Shadow Dash! Consegue me superar?', world:'TOP 3 MUNDIAL', localBoard:'SEUS TOP 3', namePrompt:'Digite seu nome para o ranking mundial (máx. 12):', tag:'Corra mais que a noite. Desvie, deslize, sobreviva.', start:'TOQUE / PRESSIONE ESPAÇO PARA COMEÇAR', jump:'PULAR (x2):  Espaço / ↑ / W / toque à direita', slide:'DESLIZAR:  ↓ / S / toque à esquerda      PAUSA: P', equipped:'EQUIPADO', equip:'TOQUE PARA EQUIPAR', unlock:'DESBLOQUEAR', coins:'MOEDAS', best:'RECORDE', paused:'PAUSADO', resume:'Pressione P ou toque para continuar', over:'FIM DE JOGO', score:'PONTOS', newbest:'★ NOVO RECORDE! ★', gained:'Moedas', wallet:'Total', loading:'CARREGANDO ANÚNCIO…', revive:'▶  REVIVER  (VER ANÚNCIO)', retry:'TOQUE / ESPAÇO PARA TENTAR DE NOVO', shield:'ESCUDO', magnet:'ÍMÃ', shieldT:'ESCUDO!', magnetT:'ÍMÃ!', broke:'ESCUDO QUEBRADO', revived:'REVIVIDO!', need:'FALTAM {n} MOEDAS', unlocked:'{s} DESBLOQUEADO!' },
  fr: { name:'FR', share:'PARTAGER', copied:'LIEN COPIÉ !', shareText:'J\'ai fait {n} points à Shadow Dash ! Tu peux me battre ?', world:'TOP 3 MONDIAL', localBoard:'TON TOP 3', namePrompt:'Entre ton nom pour le classement mondial (12 max) :', tag:'Cours plus vite que la nuit. Esquive, glisse, survis.', start:'TOUCHE / APPUIE SUR ESPACE POUR JOUER', jump:'SAUTER (x2) :  Espace / ↑ / W / touche à droite', slide:'GLISSER :  ↓ / S / touche à gauche      PAUSE : P', equipped:'ÉQUIPÉ', equip:'TOUCHE POUR ÉQUIPER', unlock:'DÉBLOQUER', coins:'PIÈCES', best:'RECORD', paused:'PAUSE', resume:'Appuie sur P ou touche pour reprendre', over:'PARTIE TERMINÉE', score:'SCORE', newbest:'★ NOUVEAU RECORD ! ★', gained:'Pièces', wallet:'Total', loading:'CHARGEMENT DE LA PUB…', revive:'▶  REVIVRE  (VOIR UNE PUB)', retry:'TOUCHE / ESPACE POUR REJOUER', shield:'BOUCLIER', magnet:'AIMANT', shieldT:'BOUCLIER !', magnetT:'AIMANT !', broke:'BOUCLIER BRISÉ', revived:'REVENU !', need:'IL MANQUE {n} PIÈCES', unlocked:'{s} DÉBLOQUÉ !' },
  de: { name:'DE', share:'TEILEN', copied:'LINK KOPIERT!', shareText:'Ich habe {n} Punkte in Shadow Dash! Schaffst du mehr?', world:'WELT-TOP-3', localBoard:'DEINE TOP 3', namePrompt:'Gib deinen Namen für die Weltrangliste ein (max. 12):', tag:'Lauf der Nacht davon. Ausweichen, rutschen, überleben.', start:'TIPPEN / LEERTASTE ZUM STARTEN', jump:'SPRINGEN (x2):  Leertaste / ↑ / W / rechts tippen', slide:'RUTSCHEN:  ↓ / S / links tippen      PAUSE: P', equipped:'AUSGERÜSTET', equip:'TIPPEN ZUM AUSRÜSTEN', unlock:'FREISCHALTEN', coins:'MÜNZEN', best:'REKORD', paused:'PAUSE', resume:'P drücken oder tippen zum Fortsetzen', over:'SPIEL VORBEI', score:'PUNKTE', newbest:'★ NEUER REKORD! ★', gained:'Münzen', wallet:'Gesamt', loading:'WERBUNG LÄDT…', revive:'▶  WIEDERBELEBEN  (WERBUNG)', retry:'TIPPEN / LEERTASTE: NOCHMAL', shield:'SCHILD', magnet:'MAGNET', shieldT:'SCHILD!', magnetT:'MAGNET!', broke:'SCHILD ZERBROCHEN', revived:'WIEDERBELEBT!', need:'NOCH {n} MÜNZEN', unlocked:'{s} FREIGESCHALTET!' },
  id: { name:'ID', share:'BAGIKAN', copied:'TAUTAN DISALIN!', shareText:'Skorku {n} di Shadow Dash! Bisa mengalahkanku?', world:'TOP 3 DUNIA', localBoard:'TOP 3 KAMU', namePrompt:'Masukkan namamu untuk peringkat dunia (maks. 12):', tag:'Lari dari malam. Hindari, meluncur, bertahan.', start:'KETUK / TEKAN SPASI UNTUK MULAI', jump:'LOMPAT (x2):  Spasi / ↑ / W / ketuk kanan', slide:'MELUNCUR:  ↓ / S / ketuk kiri      JEDA: P', equipped:'DIPAKAI', equip:'KETUK UNTUK PAKAI', unlock:'BUKA', coins:'KOIN', best:'TERBAIK', paused:'JEDA', resume:'Tekan P atau ketuk untuk lanjut', over:'GAME OVER', score:'SKOR', newbest:'★ REKOR BARU! ★', gained:'Koin', wallet:'Total', loading:'MEMUAT IKLAN…', revive:'▶  HIDUP LAGI  (LIHAT IKLAN)', retry:'KETUK / SPASI UNTUK ULANG', shield:'PERISAI', magnet:'MAGNET', shieldT:'PERISAI!', magnetT:'MAGNET!', broke:'PERISAI PECAH', revived:'HIDUP LAGI!', need:'KURANG {n} KOIN', unlocked:'{s} TERBUKA!' }
};
const LANG_LIST = Object.keys(STR);
let lang = load('_lang', '');
if (!STR[lang]) { const nav = ((navigator.language || 'en') + '').slice(0, 2).toLowerCase(); lang = STR[nav] ? nav : 'en'; }
function T(k, v) { let s = (STR[lang][k] || STR.en[k] || k); if (v) for (const x in v) s = s.replace('{' + x + '}', v[x]); return s; }
function cycleLang() { lang = LANG_LIST[(LANG_LIST.indexOf(lang) + 1) % LANG_LIST.length]; save('_lang', lang); }

/* =====================  RANDOM / HELPERS  ===================== */
function mulberry(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a);
  t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

/* =====================  BACKGROUND  ===================== */
const srand = mulberry(7);
const stars = Array.from({ length: 70 }, () => ({ x: srand() * W, y: srand() * 280, s: srand() * 1.6 + 0.4, p: srand() * 6 }));
const layers = [
  { f: 0.06, col: '#1c1438', min: 90,  max: 190, win: false },
  { f: 0.18, col: '#130d2b', min: 120, max: 250, win: true  },
  { f: 0.42, col: '#0a0719', min: 150, max: 320, win: true  }
];
layers.forEach(l => {
  l.b = []; let x = 0;
  while (x < 1700) {
    const w = 60 + srand() * 90, h = l.min + srand() * (l.max - l.min);
    const cols = Math.floor(w / 16), rows = Math.floor(h / 22);
    const win = []; for (let i = 0; i < cols * rows; i++) win.push(srand() > 0.72);
    l.b.push({ x, w, h, cols, rows, win }); x += w + srand() * 12;
  }
  l.L = x;
});
let bgOff = 0, groundOff = 0;

function drawBackground(t) {
  const g = ctx.createLinearGradient(0, 0, 0, GROUND);
  g.addColorStop(0, '#07051a'); g.addColorStop(0.65, '#1a0b2e'); g.addColorStop(1, '#3d0f2f');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  for (const s of stars) {
    ctx.globalAlpha = 0.4 + 0.6 * Math.abs(Math.sin(t * 1.5 + s.p));
    ctx.fillStyle = '#fff'; ctx.fillRect(s.x, s.y, s.s, s.s);
  }
  ctx.globalAlpha = 1;
  // moon
  const mg = ctx.createRadialGradient(780, 110, 10, 780, 110, 110);
  mg.addColorStop(0, 'rgba(255,230,230,.35)'); mg.addColorStop(1, 'rgba(255,60,90,0)');
  ctx.fillStyle = mg; ctx.fillRect(660, 0, 240, 240);
  ctx.fillStyle = '#ffe9e9'; ctx.beginPath(); ctx.arc(780, 110, 34, 0, 7); ctx.fill();
  ctx.fillStyle = 'rgba(180,120,140,.35)';
  ctx.beginPath(); ctx.arc(768, 102, 7, 0, 7); ctx.fill();
  ctx.beginPath(); ctx.arc(794, 124, 5, 0, 7); ctx.fill();
  // skyline
  for (const l of layers) {
    const off = (bgOff * l.f) % l.L;
    for (const b of l.b) {
      for (let k = 0; k < 2; k++) {
        const bx = b.x - off + k * l.L;
        if (bx + b.w < 0 || bx > W) continue;
        ctx.fillStyle = l.col; ctx.fillRect(bx, GROUND - b.h, b.w, b.h + 2);
        if (l.win) {
          ctx.fillStyle = l.f > 0.3 ? 'rgba(255,190,90,.75)' : 'rgba(255,120,170,.5)';
          for (let c = 0; c < b.cols; c++) for (let r = 0; r < b.rows; r++)
            if (b.win[r * b.cols + c]) ctx.fillRect(bx + 6 + c * 16, GROUND - b.h + 8 + r * 22, 6, 9);
        }
      }
    }
  }
  // ground
  ctx.fillStyle = '#07050f'; ctx.fillRect(0, GROUND, W, H - GROUND);
  ctx.shadowColor = '#ff2d55'; ctx.shadowBlur = 14;
  ctx.fillStyle = '#ff2d55'; ctx.fillRect(0, GROUND, W, 3);
  ctx.shadowBlur = 0;
  ctx.fillStyle = '#1b1230';
  for (let i = -1; i < 10; i++) {
    const x = ((i * 120 - groundOff) % 1200 + 1200) % 1200 - 120;
    ctx.fillRect(x, GROUND + 32, 60, 5);
    ctx.fillRect(x + 50, GROUND + 64, 40, 4);
  }
}

/* =====================  LEADERBOARD  =====================
   World ranking uses a Firebase Realtime Database over plain HTTPS (no SDK).
   Set the URL below (or define window.SHADOW_DASH_BOARD_URL before the game loads).
   Until a URL is set, the game shows a local "YOUR TOP 3" board instead. See LEADERBOARD-SETUP.md. */
const BOARD_DEFAULT_URL = '';        // e.g. 'https://your-project-default-rtdb.firebaseio.com'
function boardUrl() { return (window.SHADOW_DASH_BOARD_URL || BOARD_DEFAULT_URL || '').replace(/\/$/, ''); }
let playerName = load('_name', '');
let localTop = []; try { localTop = JSON.parse(load('_localtop', '[]')) || []; } catch (e) { localTop = []; }
let board = { top: localTop.slice(0, 3), status: 'local' };
function cleanName(n) { return (n || '').replace(/[^\p{L}\p{N} _.-]/gu, '').trim().slice(0, 12); }
function addLocal(sc) {
  if (sc <= 0) return;
  localTop.push({ name: playerName || 'YOU', score: sc });
  localTop.sort((a, b) => b.score - a.score); localTop = localTop.slice(0, 3);
  save('_localtop', JSON.stringify(localTop));
  if (!boardUrl()) board = { top: localTop.slice(0, 3), status: 'local' };
}
async function fetchBoard() {
  const u = boardUrl();
  if (!u) { board = { top: localTop.slice(0, 3), status: 'local' }; return; }
  if (board.status !== 'online') board.status = 'loading';
  try {
    const r = await fetch(u + '/scores.json?orderBy="score"&limitToLast=60');
    if (!r.ok) throw new Error('http ' + r.status);
    const j = await r.json(), best = {};
    for (const v of Object.values(j || {})) {
      if (!v || typeof v.score !== 'number' || typeof v.name !== 'string') continue;
      if (!best[v.name] || v.score > best[v.name].score) best[v.name] = v;      // one row per player
    }
    board = { top: Object.values(best).sort((a, b) => b.score - a.score).slice(0, 3), status: 'online' };
  } catch (e) { board = { top: localTop.slice(0, 3), status: 'error' }; }
}
async function submitScore(sc) {
  const u = boardUrl(); if (!u || sc <= 0) return;
  try {
    await fetch(u + '/scores.json', { method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name: playerName || 'PLAYER', score: sc, ts: Date.now() }) });
  } catch (e) {}
  fetchBoard();
}
function askName(then) {                       // DOM overlay (works in iframes and on phones, unlike prompt())
  if (document.getElementById('nameBox')) return;
  const d = document.createElement('div'); d.id = 'nameBox';
  d.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.72);display:flex;align-items:center;justify-content:center;z-index:9;font-family:system-ui,sans-serif';
  d.innerHTML = '<div style="background:#120c26;border:2px solid #ff2d55;padding:18px;border-radius:10px;color:#fff;max-width:320px;text-align:center"><div id="nbT" style="margin-bottom:10px;font-size:15px"></div><input id="nbI" maxlength="12" autocomplete="off" style="font-size:18px;padding:8px;width:90%;text-align:center;border-radius:6px;border:0"><br><button id="nbB" style="margin-top:12px;font-size:16px;padding:8px 24px;border:0;border-radius:6px;background:#ff2d55;color:#fff;font-weight:700">OK</button></div>';
  document.body.appendChild(d);
  const i = d.querySelector('#nbI'); d.querySelector('#nbT').textContent = T('namePrompt'); i.value = playerName; i.focus();
  const done = () => { const n = cleanName(i.value); if (n) { playerName = n; save('_name', n); } d.remove(); if (then) then(); };
  d.querySelector('#nbB').addEventListener('click', done);
  i.addEventListener('keydown', e => { if (e.key === 'Enter') done(); });
}
function onScore() {
  const sc = score;                                   // capture now: the player may restart before the name box closes
  addLocal(sc);
  if (newBest && boardUrl()) {
    setTimeout(() => { if (!playerName) askName(() => submitScore(sc)); else submitScore(sc); }, 700);
  } else fetchBoard();
}
const GAME_URL = 'https://pulkitkhatter.github.io/shadow-dash/';
function shareScore() {
  const msg = T('shareText', { n: score });
  if (navigator.share) { navigator.share({ title: 'Shadow Dash', text: msg, url: GAME_URL }).catch(() => {}); return; }
  const full = msg + ' ' + GAME_URL;
  try { navigator.clipboard.writeText(full).then(() => say(T('copied'))).catch(() => say(GAME_URL)); } catch (e) { say(GAME_URL); }
}
const BOARDBOX = { x: 24, y: 150, w: 212, h: 108 };
function drawBoard() {
  const b = BOARDBOX, online = board.status === 'online' || board.status === 'loading';
  panel(b.x, b.y, b.w, b.h);
  text('🌍 ' + (online ? T('world') : T('localBoard')), b.x + b.w / 2, b.y + 17, 14, '#ffd24d');
  const cols = ['#ffd24d', '#c9d1e6', '#d6894b'];
  for (let i = 0; i < 3; i++) {
    const r = board.top[i], y = b.y + 44 + i * 25;
    text(String(i + 1), b.x + 16, y, 16, cols[i], 'left');
    if (r) {
      text(String(r.name).slice(0, 12), b.x + 36, y, 15, '#fff', 'left');
      text(String(r.score), b.x + b.w - 12, y, 15, cols[i], 'right');
    } else text('—', b.x + 36, y, 15, 'rgba(255,255,255,.35)', 'left');
  }
  if (board.status === 'loading') text('…', b.x + b.w - 14, b.y + 17, 14, '#fff', 'right');
}
fetchBoard();

/* =====================  GAME STATE  ===================== */
let state = 'menu';        // menu | play | paused | over
let player, obs, coins, parts, pickups, speed, dist, score, coinCount, shake, flash, spawnT, time = 0, overT = 0;
let best = +load('_best', 0) || 0, newBest = false, hudPulse = 0;
let banked = 0, shield = false, magnetT = 0, inv = 0, revived = false, deaths = +load('_deaths', 0) || 0;
let wallet = +load('_wallet', 0) || 0, skinIdx = +load('_skin', 0) || 0, toast = '', toastT = 0;
const SKINS = [
  { name: 'Classic',  cost: 0,   suit: '#0c0c12', suit2: '#16161f', scarf: '#e0143c', tie: '#c4122f', shirt: '#e9e9f0' },
  { name: 'Crimson',  cost: 150, suit: '#4a0a16', suit2: '#5e1220', scarf: '#111111', tie: '#111111', shirt: '#f2d9d9' },
  { name: 'Ghost',    cost: 400, suit: '#cfd6ea', suit2: '#aab3cf', scarf: '#46d9ff', tie: '#46d9ff', shirt: '#ffffff' },
  { name: 'Gold',     cost: 900, suit: '#c9a227', suit2: '#a8841a', scarf: '#ffffff', tie: '#111111', shirt: '#fff4c9' }
];
let unlocked = (load('_unlocked', '0') + '').split(',').map(Number).filter(n => n >= 0 && n < SKINS.length);
if (!unlocked.includes(0)) unlocked.push(0);
if (!unlocked.includes(skinIdx)) skinIdx = 0;
let viewSkin = skinIdx;
function say(s) { toast = s; toastT = 1.6; }
function cycleSkin(d) {
  viewSkin = (viewSkin + d + SKINS.length) % SKINS.length;
  if (unlocked.includes(viewSkin)) { skinIdx = viewSkin; save('_skin', skinIdx); }
  tone(500, 700, 0.06, 'triangle', 0.08);
}
function buySkin() {
  const s = SKINS[viewSkin];
  if (unlocked.includes(viewSkin)) { skinIdx = viewSkin; save('_skin', skinIdx); return; }
  if (wallet >= s.cost) {
    wallet -= s.cost; save('_wallet', wallet);
    unlocked.push(viewSkin); save('_unlocked', unlocked.join(',')); skinIdx = viewSkin; save('_skin', skinIdx);
    tone(500, 1400, 0.4, 'triangle', 0.14); say(T('unlocked', { s: s.name.toUpperCase() }));
  } else { tone(180, 120, 0.2, 'sawtooth', 0.1); say(T('need', { n: s.cost - wallet })); }
}

function reset() {
  player = { x: 150, y: GROUND, vy: 0, onGround: true, jumps: 0, sliding: 0, run: 0 };
  obs = []; coins = []; parts = []; pickups = [];
  speed = START_SPEED; dist = 0; score = 0; coinCount = 0;
  shield = false; magnetT = 0; inv = 0; revived = false; banked = 0;
  shake = 0; flash = 0; spawnT = 500; newBest = false; musicT = 0; musicI = 0;
}
reset();

function burst(x, y, n, col, spd = 200, life = 0.6, size = 3) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * 6.283, s = Math.random() * spd;
    parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 60, life, max: life, col, size: size * (0.5 + Math.random()) });
  }
}

function jump() {
  const p = player;
  if (p.onGround) { p.vy = -JUMP_V; p.onGround = false; p.jumps = 1; p.sliding = 0; sfx.jump(); burst(p.x, p.y, 8, '#6f6a8a', 120, 0.4); }
  else if (p.jumps < 2) { p.vy = -DJUMP_V; p.jumps = 2; sfx.djump(); burst(p.x, p.y - 30, 10, '#ff2d55', 150, 0.4); }
}
function slide() {
  const p = player;
  if (p.onGround) { if (p.sliding <= 0) { p.sliding = 0.65; sfx.slide(); } }
  else p.vy = Math.max(p.vy, 1300);        // fast-fall
}

/* ---------- obstacles ---------- */
function spawn() {
  const r = Math.random();
  const wallOK = dist > 3000;                       // tall walls appear after the warm-up
  let o;
  if (r < 0.30) {
    const n = Math.random() < 0.45 ? 2 : 1;
    o = { type: 'crate', n, w: 48 * n, h: 48 };
    if (n === 1 && Math.random() < 0.3) { o.h = 96; o.tall = true; o.w = 48; }
  } else if (r < 0.54) {
    const n = 2 + (Math.random() < 0.4 ? 1 : 0);
    o = { type: 'spikes', n, w: 30 * n, h: 30 };
  } else if (r < 0.78 || !wallOK) {
    o = { type: 'drone', w: 58, h: 34 };
  } else {
    o = { type: 'wall', w: 40, h: 128 };            // needs a double jump
  }
  o.x = W + 60;
  o.y = o.type === 'drone' ? GROUND - 102 : GROUND - o.h;
  obs.push(o);
  // coins
  const cx = o.x + o.w / 2;
  if (o.type === 'drone') {
    for (let i = 0; i < 5; i++) coins.push({ x: cx - 60 + i * 30, y: GROUND - 28, ph: i });
  } else if (Math.random() < 0.7) {
    const top = GROUND - o.h - 70;
    for (let i = 0; i < 5; i++) {
      const u = i / 4, y = top - Math.sin(u * Math.PI) * 55 + 50;
      coins.push({ x: cx - 90 + i * 45, y: y - 10, ph: i });
    }
  }
  // power-up pickup (rare)
  if (Math.random() < 0.13) {
    pickups.push({ type: Math.random() < 0.5 ? 'shield' : 'magnet', x: o.x + o.w + speed * 0.45, y: GROUND - 80, ph: Math.random() * 6 });
  }
  spawnT = o.w + speed * (o.type === 'wall' ? 0.95 : 0.78) + Math.random() * speed * 0.55;
}
function hbox(o) {
  if (o.type === 'wall') return { x: o.x + 5, y: o.y + 3, w: o.w - 10, h: o.h - 3 };
  if (o.type === 'drone') return { x: o.x + 6, y: o.y + 4, w: o.w - 12, h: o.h - 10 };
  if (o.type === 'spikes') return { x: o.x + 5, y: o.y + 8, w: o.w - 10, h: o.h - 8 };
  return { x: o.x + 4, y: o.y + 4, w: o.w - 8, h: o.h - 4 };
}
function playerBox() {
  const p = player, sl = p.sliding > 0;
  const w = sl ? 46 : 28, h = sl ? 34 : 74;
  return { x: p.x - w / 2, y: p.y - h, w, h };
}

/* =====================  UPDATE  ===================== */
function update(dt) {
  time += dt;
  if (toastT > 0) toastT -= dt;
  const p = player;

  if (state === 'menu') { bgOff += 120 * dt; groundOff += 120 * dt; p.run += dt * 12; return; }
  if (state === 'paused') return;

  if (state === 'over') {
    overT += dt;
    shake = Math.max(0, shake - dt * 1.5); flash = Math.max(0, flash - dt * 2);
    stepParts(dt);
    return;
  }

  // ---- playing ----
  speed = Math.min(MAX_SPEED, START_SPEED + dist * 0.012);
  dist += speed * dt;
  bgOff += speed * dt; groundOff += speed * dt;
  const s2 = Math.floor(dist / 20) + coinCount * 10;
  if (Math.floor(s2 / 500) > Math.floor(score / 500)) { hudPulse = 1; tone(600, 1200, 0.2, 'triangle', 0.08); }
  score = s2;

  // player physics
  p.vy += GRAVITY * dt; p.y += p.vy * dt;
  if (p.y >= GROUND) {
    p.y = GROUND; p.vy = 0;
    if (!p.onGround) { p.onGround = true; p.jumps = 0; burst(p.x, p.y, 10, '#6f6a8a', 140, 0.4); }
  }
  if (p.sliding > 0) { p.sliding -= dt; if (Math.random() < 0.6) burst(p.x - 10, p.y - 2, 1, '#ffb84d', 120, 0.3, 2); }
  p.run += dt * (8 + speed / 60);
  if (p.onGround && p.sliding <= 0 && Math.random() < 0.15) burst(p.x - 14, p.y - 2, 1, '#6f6a8a', 60, 0.35, 2);

  // spawning
  spawnT -= speed * dt;
  if (spawnT <= 0) spawn();
  for (const o of obs) o.x -= speed * dt;
  for (const c of coins) c.x -= speed * dt;
  for (const k of pickups) k.x -= speed * dt;
  obs = obs.filter(o => o.x + o.w > -80);
  pickups = pickups.filter(k => k.x > -40);
  if (magnetT > 0) magnetT -= dt;
  if (inv > 0) inv -= dt;

  // coins (with magnet pull)
  const pb = playerBox(), pcx = pb.x + pb.w / 2, pcy = pb.y + pb.h / 2;
  coins = coins.filter(c => {
    if (c.x < -40) return false;
    if (magnetT > 0) {
      const dx = pcx - c.x, dy = pcy - c.y, d = Math.hypot(dx, dy);
      if (d < 260 && d > 1) { const pull = 900 * dt; c.x += dx / d * pull; c.y += dy / d * pull; }
    }
    if (Math.hypot(c.x - pcx, c.y - pcy) < 34) {
      coinCount++; sfx.coin(); burst(c.x, c.y, 8, '#ffd24d', 160, 0.45, 2.5); return false;
    }
    return true;
  });

  // power-ups
  pickups = pickups.filter(k => {
    if (Math.hypot(k.x - pcx, k.y - pcy) < 38) {
      if (k.type === 'shield') { shield = true; say(T('shieldT')); } else { magnetT = 7; say(T('magnetT')); }
      tone(500, 1300, 0.3, 'triangle', 0.12); burst(k.x, k.y, 16, k.type === 'shield' ? '#46d9ff' : '#ff5ad1', 220, 0.6, 3);
      return false;
    }
    return true;
  });

  // collisions
  if (inv <= 0) for (const o of obs) {
    const b = hbox(o);
    if (pb.x < b.x + b.w && pb.x + pb.w > b.x && pb.y < b.y + b.h && pb.y + pb.h > b.y) {
      if (shield) {
        shield = false; inv = 1.0; shake = 0.35; flash = 0.5; sfx.hit();
        burst(o.x + o.w / 2, o.y + o.h / 2, 30, '#46d9ff', 380, 0.7, 4);
        obs.splice(obs.indexOf(o), 1); say(T('broke'));
        break;
      }
      die(); return;
    }
  }

  // music
  musicT -= dt;
  if (musicT <= 0) {
    musicT = 0.3 - (speed - START_SPEED) / (MAX_SPEED - START_SPEED) * 0.12;
    const f = BASS[musicI++ % BASS.length]; tone(f, f * 0.97, 0.22, 'triangle', 0.07);
  }
  hudPulse = Math.max(0, hudPulse - dt * 2);
  shake = Math.max(0, shake - dt * 2);
  flash = Math.max(0, flash - dt * 2);
  stepParts(dt);
}
function stepParts(dt) {
  for (const q of parts) { q.life -= dt; q.x += q.vx * dt; q.y += q.vy * dt; q.vy += 500 * dt; }
  parts = parts.filter(q => q.life > 0);
}
/* ---------- Ads adapter ----------
   Portals (CrazyGames, Poki, GameDistribution...) give you an SDK. Point window.AdSDK at it:
     window.AdSDK = { showRewarded(cb){ ... cb(true|false) }, showInterstitial(cb){ ... cb() } }
   With no SDK present, no ads are shown and the Revive button is hidden.
   Add ?adtest=1 to the URL to simulate ads while testing. */
const Ads = {
  test: /[?&]adtest=1/.test(location.search), last: Date.now(), busy: false,
  rewardedReady() {
    if (this.test) return true;
    const s = window.AdSDK;
    if (!s || typeof s.showRewarded !== 'function') return false;
    return typeof s.isRewardedReady === 'function' ? !!s.isRewardedReady() : true;
  },
  showRewarded(done) {
    this.busy = true; adMute = true; const fin = ok => { this.busy = false; adMute = false; this.last = Date.now(); done(!!ok); };
    if (this.test) return setTimeout(() => fin(true), 400);
    try { window.AdSDK.showRewarded(fin); } catch (e) { fin(false); }
  },
  showInterstitial(done) {
    const ready = this.test || (window.AdSDK && typeof window.AdSDK.showInterstitial === 'function');
    if (!ready || Date.now() - this.last < 90000) return done();
    this.busy = true; adMute = true; const fin = () => { this.busy = false; adMute = false; this.last = Date.now(); done(); };
    if (this.test) return setTimeout(fin, 400);
    try { window.AdSDK.showInterstitial(fin); } catch (e) { fin(); }
  }
};
function revive() {
  if (revived || !Ads.rewardedReady() || Ads.busy) return;
  Ads.showRewarded(ok => {
    if (!ok) return;
    revived = true; state = 'play'; inv = 2; flash = 0.4; shake = 0;
    obs = obs.filter(o => o.x > player.x + 500 || o.x + o.w < player.x - 60);
    player.y = GROUND; player.vy = 0; player.onGround = true; player.sliding = 0;
    say(T('revived'));
  });
}
function die() {
  state = 'over'; overT = 0; shake = 0.6; flash = 1;
  sfx.hit(); burst(player.x, player.y - 35, 40, '#ff2d55', 420, 0.9, 4); burst(player.x, player.y - 35, 20, '#111', 300, 0.9, 5);
  try { if (navigator.vibrate && (!navigator.userActivation || navigator.userActivation.hasBeenActive)) navigator.vibrate(120); } catch (e) {}
  if (score > best) { best = score; newBest = true; save('_best', best); setTimeout(sfx.best, 450); }
  wallet += coinCount - banked; banked = coinCount; save('_wallet', wallet);
  deaths++; save('_deaths', deaths);
  onScore();
  try { if (typeof window.onShadowDashGameOver === 'function') window.onShadowDashGameOver(score, coinCount); } catch (e) {}
}

/* =====================  DRAWING  ===================== */
function line(x1, y1, x2, y2, w, col) {
  ctx.strokeStyle = col; ctx.lineWidth = w; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
}
function limb(x, y, a1, l1, a2, l2, w, col) {      // two-segment limb, angles from straight-down
  const kx = x + Math.sin(a1) * l1, ky = y + Math.cos(a1) * l1;
  const ex = kx + Math.sin(a2) * l2, ey = ky + Math.cos(a2) * l2;
  line(x, y, kx, ky, w, col); line(kx, ky, ex, ey, w, col);
  return [ex, ey];
}
function drawPlayer(dead) {
  const p = player, sl = p.sliding > 0, air = !p.onGround;
  ctx.save();
  // shadow
  const lift = clamp((GROUND - p.y) / 220, 0, 1);
  ctx.fillStyle = 'rgba(0,0,0,' + (0.4 - lift * 0.25) + ')';
  ctx.beginPath(); ctx.ellipse(p.x, GROUND + 3, 24 - lift * 8, 5, 0, 0, 7); ctx.fill();

  ctx.translate(p.x, p.y - (sl ? 20 : 34));      // hip is origin
  if (sl) ctx.rotate(-1.35);
  if (dead) ctx.rotate(0.5);

  const sw = Math.sin(p.run);
  let a1, a2, k1, k2;
  if (air) { a1 = 0.7; k1 = -0.3; a2 = -0.35; k2 = -0.8; }
  else if (sl) { a1 = 0.15; k1 = 0.1; a2 = 0.3; k2 = 0.2; }
  else { a1 = sw * 0.9; k1 = -Math.max(0, -sw) * 0.9 - 0.2; a2 = -sw * 0.9; k2 = -Math.max(0, sw) * 0.9 - 0.2; }
  const SK = SKINS[state === 'menu' ? viewSkin : skinIdx], suit = SK.suit, suit2 = SK.suit2;
  if (inv > 0 && Math.floor(time * 20) % 2) ctx.globalAlpha = 0.45;

  // back arm + back leg
  limb(0, -30, -a1 * 0.9 - 0.2, 14, -a1 * 0.9 + 0.5, 14, 6, suit2);
  limb(0, 0, a2, 17, a2 + k2, 17, 8, suit2);
  // scarf (trails behind)
  ctx.strokeStyle = SK.scarf; ctx.lineWidth = 5; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(-2, -36);
  for (let i = 1; i <= 5; i++) ctx.lineTo(-2 - i * 9, -36 + Math.sin(time * 14 + i) * 4 + i * (air ? -1 : 1.5));
  ctx.stroke();
  // torso
  ctx.fillStyle = suit; ctx.beginPath();
  ctx.moveTo(-9, -36); ctx.lineTo(11, -36); ctx.lineTo(9, 4); ctx.lineTo(-8, 4); ctx.closePath(); ctx.fill();
  ctx.fillStyle = SK.shirt; ctx.fillRect(4, -35, 5, 22);                // shirt
  ctx.fillStyle = SK.tie; ctx.fillRect(6, -33, 2, 16);                   // tie
  // front leg
  limb(0, 0, a1, 17, a1 + k1, 17, 8, suit);
  const foot = limb(0, 0, a1, 17, a1 + k1, 17, 0.1, suit);
  ctx.fillStyle = '#050508'; ctx.beginPath(); ctx.ellipse(foot[0] + 3, foot[1], 7, 3.5, 0, 0, 7); ctx.fill();
  // head
  ctx.fillStyle = '#d9a98a'; ctx.beginPath(); ctx.arc(5, -47, 10, 0, 7); ctx.fill();
  ctx.fillStyle = '#1b1210';                                              // slicked hair + beard
  ctx.beginPath(); ctx.arc(3, -50, 10, Math.PI * 0.95, Math.PI * 2.05); ctx.fill();
  ctx.beginPath(); ctx.arc(7, -43, 8, 0.15, Math.PI - 0.2); ctx.fill();
  ctx.fillStyle = '#d9a98a'; ctx.beginPath(); ctx.arc(8, -44, 5, 0, 7); ctx.fill();
  ctx.fillStyle = '#fff'; ctx.fillRect(9, -49, 3, 3); ctx.fillStyle = '#000'; ctx.fillRect(10.5, -48.5, 1.6, 2);
  // front arm with pistol
  const hand = limb(4, -30, air ? -1.2 : 1.6 + sw * 0.15, 13, air ? -1.5 : 1.55, 13, 6, suit);
  ctx.fillStyle = '#9aa0ad'; ctx.fillRect(hand[0] - 1, hand[1] - 3, 14, 5);
  ctx.restore();
  ctx.globalAlpha = 1;
  if (shield && !dead) {                                                  // shield bubble
    ctx.save(); ctx.translate(p.x, p.y - 38);
    const pulse = 1 + Math.sin(time * 8) * 0.04;
    ctx.shadowColor = '#46d9ff'; ctx.shadowBlur = 16;
    ctx.fillStyle = 'rgba(70,217,255,.14)'; ctx.strokeStyle = 'rgba(70,217,255,.85)'; ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.ellipse(0, 0, 36 * pulse, 48 * pulse, 0, 0, 7); ctx.fill(); ctx.stroke();
    ctx.restore();
  }
}

function drawPickup(k) {
  const bob = Math.sin(time * 4 + k.ph) * 5, col = k.type === 'shield' ? '#46d9ff' : '#ff5ad1';
  ctx.save(); ctx.translate(k.x, k.y + bob);
  ctx.shadowColor = col; ctx.shadowBlur = 16;
  ctx.fillStyle = 'rgba(8,5,20,.85)'; ctx.strokeStyle = col; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.arc(0, 0, 19, 0, 7); ctx.fill(); ctx.stroke(); ctx.shadowBlur = 0;
  ctx.strokeStyle = col; ctx.fillStyle = col; ctx.lineWidth = 3.5; ctx.lineCap = 'round';
  if (k.type === 'shield') {
    ctx.beginPath(); ctx.moveTo(-9, -8); ctx.lineTo(9, -8); ctx.lineTo(9, 1); ctx.quadraticCurveTo(9, 10, 0, 13); ctx.quadraticCurveTo(-9, 10, -9, 1); ctx.closePath(); ctx.stroke();
  } else {
    ctx.beginPath(); ctx.arc(0, -1, 8.5, Math.PI, 0); ctx.stroke();
    ctx.fillRect(-11.5, -2, 5, 11); ctx.fillRect(6.5, -2, 5, 11);
  }
  ctx.restore();
}

function drawObstacle(o) {
  ctx.save(); ctx.translate(o.x, o.y);
  if (o.type === 'crate') {
    const rows = Math.round(o.h / 48);
    for (let r = 0; r < rows; r++) for (let i = 0; i < o.n; i++) {
      const x = i * 48, y = r * 48;
      ctx.fillStyle = '#3a2619'; ctx.fillRect(x, y, 48, 48);
      ctx.strokeStyle = '#8a6240'; ctx.lineWidth = 3; ctx.strokeRect(x + 2, y + 2, 44, 44);
      ctx.strokeStyle = '#5d4128'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(x + 4, y + 4); ctx.lineTo(x + 44, y + 44); ctx.moveTo(x + 44, y + 4); ctx.lineTo(x + 4, y + 44); ctx.stroke();
    }
  } else if (o.type === 'wall') {
    const g = ctx.createLinearGradient(0, 0, 40, 0); g.addColorStop(0, '#2a2f45'); g.addColorStop(0.5, '#454c6b'); g.addColorStop(1, '#2a2f45');
    ctx.fillStyle = g; ctx.fillRect(0, 0, 40, o.h);
    ctx.fillStyle = '#ff2d55'; ctx.shadowColor = '#ff2d55'; ctx.shadowBlur = 10;
    for (let y = 8; y < o.h; y += 32) ctx.fillRect(0, y, 40, 4);
    ctx.shadowBlur = 0;
    ctx.fillStyle = '#12142a'; ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(6, -8); ctx.lineTo(14, 0); ctx.lineTo(22, -8); ctx.lineTo(30, 0); ctx.lineTo(40, -8); ctx.lineTo(40, 0); ctx.closePath(); ctx.fill();
  } else if (o.type === 'spikes') {
    for (let i = 0; i < o.n; i++) {
      const x = i * 30;
      const g = ctx.createLinearGradient(0, 0, 0, 30); g.addColorStop(0, '#e6e9f2'); g.addColorStop(1, '#5a6070');
      ctx.fillStyle = g; ctx.beginPath(); ctx.moveTo(x, 30); ctx.lineTo(x + 15, 0); ctx.lineTo(x + 30, 30); ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#ff2d55'; ctx.beginPath(); ctx.moveTo(x + 11, 9); ctx.lineTo(x + 15, 0); ctx.lineTo(x + 19, 9); ctx.closePath(); ctx.fill();
    }
  } else {
    const bob = Math.sin(time * 6 + o.x * 0.01) * 4;
    ctx.translate(0, bob);
    ctx.fillStyle = 'rgba(255,45,85,.07)'; ctx.beginPath();            // scan beam
    ctx.moveTo(14, 30); ctx.lineTo(44, 30); ctx.lineTo(70, GROUND - o.y - bob); ctx.lineTo(-12, GROUND - o.y - bob); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#1f2636'; ctx.beginPath(); ctx.ellipse(29, 22, 29, 13, 0, 0, 7); ctx.fill();
    ctx.fillStyle = '#323d55'; ctx.beginPath(); ctx.ellipse(29, 17, 20, 8, 0, 0, 7); ctx.fill();
    ctx.shadowColor = '#ff2d55'; ctx.shadowBlur = 12; ctx.fillStyle = '#ff2d55';
    ctx.beginPath(); ctx.arc(29, 24, 5, 0, 7); ctx.fill(); ctx.shadowBlur = 0;
    const rw = 24 * Math.abs(Math.cos(time * 40));
    line(29 - rw, 5, 29 + rw, 5, 3, '#8b93a8'); line(29, 5, 29, 10, 3, '#8b93a8');
  }
  ctx.restore();
}

function drawCoin(c) {
  const sq = Math.abs(Math.cos(time * 5 + c.ph));
  ctx.shadowColor = '#ffd24d'; ctx.shadowBlur = 8;
  ctx.fillStyle = '#ffd24d'; ctx.beginPath(); ctx.ellipse(c.x, c.y, 10 * (0.25 + 0.75 * sq), 10, 0, 0, 7); ctx.fill();
  ctx.shadowBlur = 0;
  ctx.fillStyle = '#ffec9a'; ctx.beginPath(); ctx.ellipse(c.x, c.y, 5 * (0.25 + 0.75 * sq), 6, 0, 0, 7); ctx.fill();
}

function text(str, x, y, size, col = '#fff', align = 'center', glow) {
  ctx.font = '800 ' + size + 'px "Trebuchet MS", "Segoe UI", system-ui, sans-serif';
  ctx.textAlign = align; ctx.textBaseline = 'middle';
  if (glow) { ctx.shadowColor = glow; ctx.shadowBlur = 18; }
  ctx.fillStyle = col; ctx.fillText(str, x, y);
  ctx.shadowBlur = 0;
}
function panel(x, y, w, h) {
  ctx.fillStyle = 'rgba(8,5,20,.78)'; ctx.fillRect(x, y, w, h);
  ctx.strokeStyle = 'rgba(255,45,85,.7)'; ctx.lineWidth = 2; ctx.strokeRect(x, y, w, h);
}

const MUTE = { x: W - 56, y: 12, w: 44, h: 34 };
const SKINROW = { y: 434, h: 44 };
const LANGBTN = { x: W - 118, y: 12, w: 56, h: 34 };
const SHAREBTN = { x: 730, y: 150, w: 190, h: 44 };
const REVIVE = { x: W / 2 - 150, y: 322, w: 300, h: 44 };
function drawHud() {
  const sc = 1 + hudPulse * 0.25;
  ctx.save(); ctx.translate(24, 36); ctx.scale(sc, sc);
  text(String(score).padStart(5, '0'), 0, 0, 34, '#fff', 'left', '#ff2d55'); ctx.restore();
  text(T('best') + ' ' + best, 26, 68, 16, '#b9b2d6', 'left');
  ctx.fillStyle = '#ffd24d'; ctx.beginPath(); ctx.arc(32, 94, 8, 0, 7); ctx.fill();
  text('× ' + coinCount, 48, 94, 18, '#ffd24d', 'left');
  // mute button
  ctx.fillStyle = 'rgba(8,5,20,.6)'; ctx.fillRect(MUTE.x, MUTE.y, MUTE.w, MUTE.h);
  ctx.strokeStyle = 'rgba(255,255,255,.35)'; ctx.lineWidth = 1.5; ctx.strokeRect(MUTE.x, MUTE.y, MUTE.w, MUTE.h);
  text(muted ? '🔇' : '🔊', MUTE.x + 22, MUTE.y + 18, 18);
  // active power-ups
  let py = 122;
  if (shield) { text('🛡 ' + T('shield'), 24, py, 15, '#46d9ff', 'left'); py += 22; }
  if (magnetT > 0) { text('🧲 ' + T('magnet') + ' ' + Math.ceil(magnetT) + 's', 24, py, 15, '#ff5ad1', 'left'); }
  if (toastT > 0) { ctx.globalAlpha = clamp(toastT, 0, 1); text(toast, W / 2, 90, 30, '#fff', 'center', '#ff2d55'); ctx.globalAlpha = 1; }
}

function draw() {
  ctx.setTransform(fit.k, 0, 0, fit.k, 0, 0);
  ctx.save();
  if (shake > 0) ctx.translate((Math.random() - 0.5) * shake * 22, (Math.random() - 0.5) * shake * 22);
  drawBackground(time);
  for (const c of coins) drawCoin(c);
  for (const o of obs) drawObstacle(o);
  for (const k of pickups) drawPickup(k);
  if (state !== 'over' || overT < 0.05) drawPlayer(false);
  else if (overT < 0.4) drawPlayer(true);
  for (const q of parts) {
    ctx.globalAlpha = clamp(q.life / q.max, 0, 1); ctx.fillStyle = q.col;
    ctx.fillRect(q.x - q.size / 2, q.y - q.size / 2, q.size, q.size);
  }
  ctx.globalAlpha = 1;
  ctx.restore();

  if (flash > 0) { ctx.fillStyle = 'rgba(255,255,255,' + flash * 0.5 + ')'; ctx.fillRect(0, 0, W, H); }
  if (state === 'play' || state === 'paused' || state === 'over') drawHud(); else drawMuteOnly();

  if (state === 'menu') {
    drawBoard();
    text('SHADOW', W / 2, 120, 86, '#fff', 'center', '#ff2d55');
    text('DASH', W / 2, 196, 86, '#ff2d55', 'center', '#ff2d55');
    text(T('tag'), W / 2, 252, 20, '#c9c2e6');
    const a = 0.55 + 0.45 * Math.sin(time * 4);
    ctx.globalAlpha = a; text(T('start'), W / 2, 330, 28, '#fff', 'center', '#ff2d55'); ctx.globalAlpha = 1;
    panel(W / 2 - 250, 356, 500, 66);
    text(T('jump'), W / 2, 376, 16, '#e8e4ff');
    text(T('slide'), W / 2, 402, 16, '#e8e4ff');
    // skin selector
    const sk = SKINS[viewSkin], own = unlocked.includes(viewSkin);
    panel(W / 2 - 230, SKINROW.y, 460, SKINROW.h);
    text('◀', W / 2 - 205, SKINROW.y + 22, 24, '#fff'); text('▶', W / 2 + 205, SKINROW.y + 22, 24, '#fff');
    ctx.fillStyle = sk.suit; ctx.fillRect(W / 2 - 160, SKINROW.y + 10, 24, 24);
    ctx.fillStyle = sk.scarf; ctx.fillRect(W / 2 - 136, SKINROW.y + 10, 8, 24);
    text(sk.name.toUpperCase(), W / 2 - 112, SKINROW.y + 22, 20, '#fff', 'left');
    text(own ? (viewSkin === skinIdx ? T('equipped') : T('equip')) : T('unlock') + '  ' + sk.cost + ' ●', W / 2 + 180, SKINROW.y + 22, 17, own ? '#7dffb2' : (wallet >= sk.cost ? '#ffd24d' : '#ff8aa0'), 'right');
    text(T('coins') + '  ' + wallet + '        ' + T('best') + '  ' + best, W / 2, 512, 18, '#ffd24d');
  } else if (state === 'paused') {
    ctx.fillStyle = 'rgba(0,0,0,.55)'; ctx.fillRect(0, 0, W, H);
    text(T('paused'), W / 2, 240, 64, '#fff', 'center', '#ff2d55');
    text(T('resume'), W / 2, 300, 22, '#c9c2e6');
  } else if (state === 'over' && overT > 0.45) {
    const k = clamp((overT - 0.45) * 4, 0, 1);
    ctx.globalAlpha = k;
    drawBoard();
    panel(W / 2 - 230, 120, 460, 300);
    text(T('over'), W / 2, 168, 52, '#ff2d55', 'center', '#ff2d55');
    text(T('score') + '  ' + score, W / 2, 228, 36, '#fff');
    text(newBest ? T('newbest') : T('best') + '  ' + best, W / 2, 268, 24, newBest ? '#ffd24d' : '#b9b2d6');
    text(T('gained') + '  +' + coinCount + '      ' + T('wallet') + '  ' + wallet, W / 2, 300, 18, '#ffd24d');
    if (!revived && Ads.rewardedReady()) {
      ctx.fillStyle = Ads.busy ? '#444' : '#1d9c5a'; ctx.fillRect(REVIVE.x, REVIVE.y, REVIVE.w, REVIVE.h);
      ctx.strokeStyle = '#7dffb2'; ctx.lineWidth = 2; ctx.strokeRect(REVIVE.x, REVIVE.y, REVIVE.w, REVIVE.h);
      text(Ads.busy ? T('loading') : T('revive'), W / 2, REVIVE.y + 22, 19, '#fff');
    }
    if (!window.SD_PORTAL) {            // portals (CrazyGames etc.) don't allow outbound share links
      ctx.fillStyle = '#ff2d55'; ctx.fillRect(SHAREBTN.x, SHAREBTN.y, SHAREBTN.w, SHAREBTN.h);
      ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.strokeRect(SHAREBTN.x, SHAREBTN.y, SHAREBTN.w, SHAREBTN.h);
      text('↗ ' + T('share'), SHAREBTN.x + SHAREBTN.w / 2, SHAREBTN.y + 23, 19, '#fff');
    }
    if (overT > 0.9) { ctx.globalAlpha = k * (0.55 + 0.45 * Math.sin(time * 5)); text(T('retry'), W / 2, 394, 22, '#fff'); }
    ctx.globalAlpha = 1;
  }
}
function drawMuteOnly() {
  ctx.fillStyle = 'rgba(8,5,20,.6)'; ctx.fillRect(LANGBTN.x, LANGBTN.y, LANGBTN.w, LANGBTN.h);
  ctx.strokeStyle = 'rgba(255,255,255,.35)'; ctx.lineWidth = 1.5; ctx.strokeRect(LANGBTN.x, LANGBTN.y, LANGBTN.w, LANGBTN.h);
  text('🌐 ' + STR[lang].name, LANGBTN.x + 28, LANGBTN.y + 18, 15);
  ctx.fillStyle = 'rgba(8,5,20,.6)'; ctx.fillRect(MUTE.x, MUTE.y, MUTE.w, MUTE.h);
  ctx.strokeStyle = 'rgba(255,255,255,.35)'; ctx.lineWidth = 1.5; ctx.strokeRect(MUTE.x, MUTE.y, MUTE.w, MUTE.h);
  text(muted ? '🔇' : '🔊', MUTE.x + 22, MUTE.y + 18, 18);
  if (toastT > 0) { ctx.globalAlpha = clamp(toastT, 0, 1); text(toast, W / 2, 300, 24, '#fff', 'center', '#ff2d55'); ctx.globalAlpha = 1; }
}

/* =====================  INPUT  ===================== */
function startGame() { reset(); state = 'play'; }
function action(kind) {
  audio();
  if (Ads.busy) return;
  if (state === 'menu') { startGame(); if (kind === 'jump') jump(); return; }
  if (state === 'over') {
    if (overT > 0.6) {
      if (deaths % 3 === 0) Ads.showInterstitial(() => startGame()); else startGame();
    }
    return;
  }
  if (state === 'paused') { if (kind === 'pause') state = 'play'; return; }
  if (kind === 'jump') jump(); else if (kind === 'slide') slide();
}
function togglePause() { if (state === 'play') state = 'paused'; else if (state === 'paused') state = 'play'; }
function toggleMute() { muted = !muted; save('_mute', muted ? '1' : '0'); audio(); }

addEventListener('keydown', e => {
  if (document.getElementById('nameBox')) return;      // typing a name: don't steer the game
  if (e.repeat) { if (['Space', 'ArrowUp', 'ArrowDown'].includes(e.code)) e.preventDefault(); return; }
  switch (e.code) {
    case 'Space': case 'ArrowUp': case 'KeyW': case 'Enter': e.preventDefault(); action('jump'); break;
    case 'ArrowDown': case 'KeyS': e.preventDefault(); action('slide'); break;
    case 'KeyP': case 'Escape': if (state === 'paused') action('pause'); else togglePause(); break;
    case 'KeyM': toggleMute(); break;
    case 'ArrowLeft': if (state === 'menu') cycleSkin(-1); break;
    case 'ArrowRight': if (state === 'menu') cycleSkin(1); break;
    case 'KeyB': if (state === 'menu') buySkin(); break;
    case 'KeyL': if (state === 'menu') cycleLang(); break;
    case 'KeyN': if (state === 'menu' && boardUrl()) askName(fetchBoard); break;
    case 'KeyR': if (state === 'over' && overT > 0.6) revive(); break;
  }
});
cv.addEventListener('pointerdown', e => {
  e.preventDefault();
  const r = cv.getBoundingClientRect();
  const x = (e.clientX - r.left) / r.width * W, y = (e.clientY - r.top) / r.height * H;
  if (x >= MUTE.x && x <= MUTE.x + MUTE.w && y >= MUTE.y && y <= MUTE.y + MUTE.h) { toggleMute(); return; }
  if (state === 'paused') { state = 'play'; return; }
  const inR = (r) => x >= r.x && x <= r.x + r.w && y >= r.y && y <= r.y + r.h;
  if (state === 'menu') {
    audio();
    if (boardUrl() && x >= BOARDBOX.x && x <= BOARDBOX.x + BOARDBOX.w && y >= BOARDBOX.y && y <= BOARDBOX.y + BOARDBOX.h) { askName(fetchBoard); return; }
    if (x >= LANGBTN.x && x <= LANGBTN.x + LANGBTN.w && y >= LANGBTN.y && y <= LANGBTN.y + LANGBTN.h) { cycleLang(); return; }
    if (y >= SKINROW.y && y <= SKINROW.y + SKINROW.h && x > W / 2 - 240 && x < W / 2 + 240) {
      if (x < W / 2 - 170) cycleSkin(-1); else if (x > W / 2 + 170) cycleSkin(1); else buySkin();
      return;
    }
  }
  if (state === 'over' && overT > 0.6 && !window.SD_PORTAL && inR(SHAREBTN)) { shareScore(); return; }
  if (state === 'over' && overT > 0.6 && !revived && Ads.rewardedReady() && inR(REVIVE)) { revive(); return; }
  action(x < W * 0.35 && state === 'play' ? 'slide' : 'jump');
});
addEventListener('contextmenu', e => e.preventDefault());
document.addEventListener('visibilitychange', () => { if (document.hidden && state === 'play') state = 'paused'; });
addEventListener('blur', () => { if (state === 'play') state = 'paused'; });

/* =====================  MAIN LOOP  ===================== */
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.033, (now - last) / 1000); last = now;
  update(dt); draw();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

// offline support (only on http/https hosting)
const IN_APP = !!(window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform());
if (!IN_APP && 'serviceWorker' in navigator && /^https?:/.test(location.protocol)) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}

// tiny debug/test hook (harmless in production)
window.__shadowDash = { get state() { return state; }, get score() { return score; }, action,
  _fetchBoard: () => fetchBoard(), _board: () => board,
  _peek: () => ({ px: player.x, speed, onGround: player.onGround, jumps: player.jumps, state,
                  obs: obs.map(o => ({ t: o.type, x: o.x, w: o.w })) }),
  _demo() { obs.push({ type: 'wall', w: 40, h: 128, x: 700, y: GROUND - 128 });
            pickups.push({ type: 'shield', x: 420, y: GROUND - 80, ph: 0 }, { type: 'magnet', x: 560, y: GROUND - 80, ph: 1 }); } };
})();
</script>
